<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт событий</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Учёт событий</h1>
    <p class="subtitle">Выберите событие и отправьте его на сервер.</p>

    <form id="event-form">
      <fieldset>
        <legend>Событие</legend>
        <label class="radio-row">
          <input type="radio" name="event" value="1">
          <span>Событие 1</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="event" value="2">
          <span>Событие 2</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="event" value="3">
          <span>Событие 3</span>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit" id="send-button">Отправить событие</button>
        <button type="button" id="load-button">Показать список</button>
      </div>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Принятые события</h2>
      <p id="empty-message" class="empty">Список пока пуст.</p>
      <ol id="events-list" class="events" hidden></ol>
    </section>
  </main>
</body>
</html>
